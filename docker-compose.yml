services:
  mongo:
    image: mongo:7
    container_name: ygodnd_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ygodnd

  backend:
    build:
      # Racine du repo (pas ./backend) : le moteur de duel (engine/ocgcore/)
      # est compilé dans l'image backend elle-même (voir backend/Dockerfile,
      # stage ocgcore-build) et a besoin d'y être visible comme contexte de build.
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: ygodnd_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-yugioh_dnd}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      YGOPRODECK_API_URL: ${YGOPRODECK_API_URL:-https://db.ygoprodeck.com/api/v7}
      # Les bind mounts Docker sous Windows/macOS ne propagent pas les événements
      # inotify : sans polling, `tsx watch` ne redémarre jamais sur modification.
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      # Code monté pour le hot-reload ; node_modules reste celui de l'image.
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/vitest.config.ts:/app/vitest.config.ts
      - backend_node_modules:/app/node_modules
      - card_images:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ygodnd

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: ygodnd_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      DOCKER_ENV: "true"
      BACKEND_URL: http://backend:3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/package.json:/app/package.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ygodnd

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
  card_images:

networks:
  ygodnd:
    driver: bridge
