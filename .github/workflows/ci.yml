name: CI

# Déclenché à chaque push (comme demandé) et sur les pull requests (même
# déclencheur, mais permet aussi de voir le résultat avant de merger) — voir
# README.md "Production / déploiement sur un serveur" pour le contexte des
# images construites ici.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job séparé (pas dans backend-test) : compile le moteur de duel en C++
  # UNE fois sur le runner nu (accès Docker nécessaire pour buildx — pas
  # possible depuis l'intérieur du conteneur `node:22-alpine` de
  # backend-test), puis exporte juste le binaire + les données pour que
  # backend-test le télécharge. RÉEL BUG que ce job corrige : sans lui,
  # backend-test lançait `npm test` sans que `/ocgcore/ocgcore_server`
  # n'existe jamais (seule l'image Docker du backend, construite plus tard
  # dans `build-images`, compile ce binaire) — `ocgcoreClient.ts` spawne ce
  # chemin en dur sans jamais écouter l'évènement `error` du child process,
  # donc un ENOENT silencieux y plantait tout duel créé pendant les tests
  # (constaté en CI : tous les tests de `duel.e2e.test.ts`/
  # `duelInvite.e2e.test.ts` en cascade, chacun réutilisant l'id d'un duel
  # jamais réellement créé).
  build-ocgcore:
    name: Compiler le moteur de duel (ocgcore) — partagé avec backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Même scope de cache que l'image backend complète dans build-images
      # ci-dessous : les deux réutilisent le même stage `ocgcore-build`, pas
      # besoin de recompiler ygopro-core/Lua deux fois par run.
      - name: Compiler uniquement le stage ocgcore-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: ocgcore-build
          push: false
          load: true
          tags: ocgcore-build-artifact:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Extraire /ocgcore (binaire + données) de l'image compilée
        run: |
          id=$(docker create ocgcore-build-artifact:latest)
          docker cp "$id:/ocgcore" ./ocgcore-artifact
          docker rm "$id"

      - uses: actions/upload-artifact@v4
        with:
          name: ocgcore-binary
          path: ocgcore-artifact
          retention-days: 1

  backend-test:
    name: Backend — typecheck + tests (Vitest, vraie base Mongo)
    runs-on: ubuntu-latest
    needs: build-ocgcore
    # Job conteneurisé (pas juste le runner nu) : c'est ce qui permet au
    # service `mongo` ci-dessous d'être joignable par son nom de service
    # ("mongo") — exactement l'hôte déjà en dur dans `npm test`
    # (MONGO_URI=mongodb://mongo:27017/..., voir backend/package.json) sans
    # avoir à le retoucher pour la CI.
    container: node:22-alpine
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Uniquement pour que env.ts (validation Zod, JWT_SECRET obligatoire,
      # min 8 caractères) accepte de démarrer en CI — jamais une vraie valeur
      # de prod, jamais un secret GitHub.
      JWT_SECRET: ci_test_secret_do_not_use_in_prod
    steps:
      - uses: actions/checkout@v4

      # Voir le commentaire sur build-ocgcore ci-dessus : sans ce binaire à
      # l'exact chemin attendu (OCGCORE_BINARY/OCGCORE_CWD dans
      # ocgcoreClient.ts), toute création de duel plante silencieusement.
      - name: Télécharger le moteur ocgcore compilé
        uses: actions/download-artifact@v4
        with:
          name: ocgcore-binary
          path: /ocgcore

      - name: Rendre le binaire exécutable
        run: chmod +x /ocgcore/ocgcore_server

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: npm-backend-

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend-build:
    name: Frontend — typecheck + build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Combine déjà `tsc --noEmit` + `vite build` (voir frontend/package.json).
      - run: npm run build

  security-audit:
    name: Audit sécurité — npm audit (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # audit-level=high : ne fait pas échouer la CI sur une vulnérabilité
      # low/moderate d'une dépendance transitive qu'on ne maîtrise pas
      # forcément (elles restent visibles dans les logs ci-dessous) — voir
      # CLAUDE.md pour un exemple réel (nodemailer) traité manuellement cette
      # façon plutôt qu'en bloquant toute la CI pour ça.
      # --omit=dev : les vulnérabilités actuelles (high/critical) sont toutes
      # dans la chaîne vite/vitest/esbuild — des devDependencies qui ne
      # partent jamais en prod (le stage `prod` du Dockerfile fait lui aussi
      # `npm install --omit=dev`) et dont l'exploitation suppose un serveur de
      # dev/UI Vitest exposé sur le réseau, jamais le cas ici (`vitest run`,
      # pas `vitest --ui`). Vérifié en direct : `npm audit --omit=dev` ne
      # remonte 0 vulnérabilité côté backend.
      - name: npm audit — backend (dépendances de production uniquement)
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit — frontend
        working-directory: frontend
        run: npm audit --audit-level=high

  codeql:
    name: Audit sécurité/qualité du code — CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # "security-and-quality" (pas juste "security") : couvre aussi les
          # requêtes de qualité de code de CodeQL, faute d'ESLint configuré
          # dans ce repo pour l'instant.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  build-images:
    name: Construire les images Docker (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-audit]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR (registre de paquets GitHub) exige un nom d'image en minuscules ;
      # github.repository ("claude-boulay/DND_DUEL_GO") ne l'est pas forcément.
      - name: Nom d'image en minuscules
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Publié UNIQUEMENT sur push vers main : sur une branche/PR, les images
      # sont quand même construites (ça valide les deux Dockerfile), juste
      # jamais poussées vers le registre — pas besoin de secret à configurer,
      # GITHUB_TOKEN suffit pour GHCR.
      - name: Connexion à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image backend (compile aussi le moteur de duel ocgcore, voir README.md)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-backend:latest
            ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:latest
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
